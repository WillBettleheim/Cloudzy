name: tests

# Offline tests on every push to main and every pull request; live API checks weekly. A failing scheduled run opens
# (or comments on) one "ci-alert" issue, so it reaches the repository owner by GitHub notification.
# Actions are pinned to commit SHAs (see SECURITY.md, "Workflow policy"); Dependabot proposes updates.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: live API checks catch upstream changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest

  integration:
    name: Live Open-Meteo checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -m integration

  notify:
    name: Report a failed scheduled run
    needs: [offline, integration]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-alert --color B60205 --description "Automated: a scheduled check failed" --force
          number=$(gh issue list --label ci-alert --state open --limit 1 --json number --jq '.[0].number')
          body="The scheduled **tests** run failed: $RUN_URL. Open the run for the failing step; no secrets are involved."
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"
          else gh issue create --title "Scheduled tests failed" --label ci-alert --body "$body"; fi
