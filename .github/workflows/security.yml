name: security

# Read-only security checks (SECURITY.md describes each and what to do when one fails). Never deploys.
# - dependencies: known vulnerabilities in the pinned Python packages (pip-audit, PyPI advisory database)
# - secrets: secret-like strings in tracked files, against the reviewed baseline (.secrets.baseline)
# - code: Python security linter, high severity and high confidence only (bandit), and ruff
# - workflows: GitHub Actions security audit (zizmor, offline rules)
# - dependency review: new vulnerable dependencies in a pull request (GitHub's dependency graph)
# A failing scheduled or main-branch run opens (or comments on) one "security-alert" issue.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC, so new advisories are found even when nothing changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - name: Audit pinned requirements
        run: |
          set -o pipefail
          pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off -f markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install detect-secrets==1.5.0
      - name: Scan tracked files against the reviewed baseline
        # Fails on any secret-like string that isn't already reviewed in .secrets.baseline. Values are never printed.
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  code:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install bandit==1.9.4 ruff==0.17.1
      - run: ruff check .
      - name: Bandit (high severity, high confidence)
        run: bandit -q -r src app_pages tools streamlit_app.py --severity-level high --confidence-level high

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install zizmor==1.31.1
      - run: zizmor --offline --min-severity medium .github/workflows

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  notify:
    name: Report a failure
    needs: [dependencies, secrets, code, workflows]
    if: failure() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          gh label create security-alert --color B60205 --description "Automated: a security check failed" --force
          number=$(gh issue list --label security-alert --state open --limit 1 --json number --jq '.[0].number')
          body="A **security** check failed ($EVENT run): $RUN_URL. Open the run to see which job failed; SECURITY.md explains what each check means and what to do."
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"
          else gh issue create --title "Security checks failed" --label security-alert --body "$body"; fi
